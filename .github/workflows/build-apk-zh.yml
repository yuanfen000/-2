name: Build PrivateLM 中文版 APK

on:
  workflow_dispatch:
  push:
    branches: ['zh-cn', 'main']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码（含子模块 stable-diffusion.cpp）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: 安装 Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" > /dev/null
        continue-on-error: true

      - name: 拉依赖
        run: flutter pub get

      - name: 编译 APK（debug 签名，仅自用）
        env:
          PRIVATELM_ALLOW_DEBUG_RELEASE_SIGNING: 'true'
        run: flutter build apk --release --split-per-abi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: privatelm-zh-cn-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
